topics:
  pointcloud: "/livox/lidar"
  imu: "/livox/imu"

calibration: # T_IMU_LIDAR (LiDAR -> IMU)
  translation: [-0.011, -0.02329, 0.04412]
  rotation: [1, 0, 0,
             0, 1, 0,
             0, 0, 1]

lidar:
  min_range_m: 0.5 # Exclude points closer than this range [m]
  max_range_m: 80 # Exclude points farther than this range [m]

base_link: # LiDAR pose in base_link (gz_x500_explorer_v2 livox include pose)
  translation: [0.07, 0.0, 0.065] # [m]
  rpy_deg: [0.0, 26.0, 0.0] # roll, pitch, yaw [deg]; +pitch = nose down
